name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Diagnose Netlify dev emulation (temporary)
        run: |
          PUBLIC_GTM_ID=GTM-TEST0000 npx astro dev --port 4321 > devserver.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4321/ && break
            sleep 1
          done
          sleep 10
          echo "=== probe /zh/ (expect 301):"
          curl -s -o /dev/null -w '%{http_code}\n' http://localhost:4321/zh/
          echo "=== probe /whats-new/ cache-control:"
          curl -s -o /dev/null -D - http://localhost:4321/whats-new/ | grep -i cache-control || true
          echo "=== dev server log:"
          cat devserver.log
          kill $DEV_PID

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests (playwright)
        run: npm test
        env:
          # Surface the dev server's startup log (Netlify emulation status)
          # in CI output — invaluable when redirect/header tests fail.
          DEBUG: pw:webserver

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
