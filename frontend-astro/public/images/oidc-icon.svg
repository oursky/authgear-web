<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <clipPath id="globe-clip">
      <!-- Clip to everything except the magnifier circle area -->
      <path d="M0 0 H24 V24 H0 Z M17 17 m-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0" fill-rule="evenodd"/>
    </clipPath>
  </defs>
  <!-- Globe clipped to not draw behind magnifier -->
  <g clip-path="url(#globe-clip)">
    <circle cx="12" cy="12" r="9"/>
    <ellipse cx="12" cy="12" rx="4" ry="9"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
  </g>
  <!-- Search magnifier -->
  <circle cx="17" cy="17" r="3"/>
  <line x1="19.2" y1="19.2" x2="22" y2="22"/>
</svg>
