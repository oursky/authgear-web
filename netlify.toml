[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# HTML pages: no browser cache (browsers revalidate on every visit) but a
# short CDN edge cache with stale-while-revalidate so deploys don't cause
# a traffic surge on revalidation. More-specific rules below take precedence
# over this wildcard for static assets.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=300, stale-while-revalidate=86400"

# Long-cache static assets that ship with the deploy. The Astro build
# emits hashed _astro/* assets which are already covered by Netlify's
# default immutable headers; this block extends the same treatment to
# the unhashed CSS/images/fonts under public/ that we treat as content-
# stable in practice (we redeploy when they change).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
