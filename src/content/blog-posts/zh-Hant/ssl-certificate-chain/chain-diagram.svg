<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="SSL 憑證信任鏈示意圖：末端憑證、中繼憑證與根憑證">
  <title>SSL 憑證信任鏈</title>
  <desc>末端憑證由中繼憑證簽發，中繼憑證由根憑證簽發。伺服器送出末端與中繼；根則預先內建於客戶端的信任庫。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F80ED"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #2F80ED; stroke-width: 2; }
    .box-root { fill: #EBF3FE; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #111827; }
    .sublabel { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #4B5563; }
    .annotation { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #6B7280; font-style: italic; }
    .pill { fill: #ECFDF5; stroke: #10B981; stroke-width: 1.5; }
    .pill-root { fill: #FEF3C7; stroke: #D97706; stroke-width: 1.5; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #065F46; }
    .pill-text-root { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #92400E; }
    .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #2F80ED; font-weight: 500; }
  </style>

  <!-- Title -->
  <text x="360" y="30" class="label" text-anchor="middle" style="font-size: 16px;">SSL 憑證信任鏈</text>

  <!-- Leaf certificate -->
  <rect x="40" y="80" width="200" height="100" rx="10" class="box"/>
  <text x="140" y="115" class="label" text-anchor="middle">末端憑證</text>
  <text x="140" y="138" class="sublabel" text-anchor="middle">yourdomain.com</text>
  <text x="140" y="158" class="sublabel" text-anchor="middle">簽發給你的網站</text>
  <rect x="60" y="170" width="160" height="22" rx="11" class="pill"/>
  <text x="140" y="186" class="pill-text" text-anchor="middle">由你的伺服器送出</text>

  <!-- Intermediate certificate -->
  <rect x="260" y="80" width="200" height="100" rx="10" class="box"/>
  <text x="360" y="115" class="label" text-anchor="middle">中繼憑證</text>
  <text x="360" y="138" class="sublabel" text-anchor="middle">例如 Let's Encrypt R3</text>
  <text x="360" y="158" class="sublabel" text-anchor="middle">由根 CA 簽發</text>
  <rect x="280" y="170" width="160" height="22" rx="11" class="pill"/>
  <text x="360" y="186" class="pill-text" text-anchor="middle">由你的伺服器送出</text>

  <!-- Root certificate -->
  <rect x="480" y="80" width="200" height="100" rx="10" class="box box-root"/>
  <text x="580" y="115" class="label" text-anchor="middle">根 CA</text>
  <text x="580" y="138" class="sublabel" text-anchor="middle">例如 ISRG Root X1</text>
  <text x="580" y="158" class="sublabel" text-anchor="middle">離線、自簽</text>
  <rect x="490" y="170" width="180" height="22" rx="11" class="pill-root"/>
  <text x="580" y="186" class="pill-text-root" text-anchor="middle">預先內建於客戶端</text>

  <!-- Arrows: signed-by relationships -->
  <line x1="240" y1="130" x2="260" y2="130" stroke="#2F80ED" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="130" x2="480" y2="130" stroke="#2F80ED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- "signs" annotations under arrows -->
  <text x="250" y="220" class="arrow-label" text-anchor="middle">由其簽發 →</text>
  <text x="470" y="220" class="arrow-label" text-anchor="middle">由其簽發 →</text>

  <!-- Bottom annotation -->
  <text x="360" y="265" class="annotation" text-anchor="middle">瀏覽器透過鏈一路驗證回它已信任的根，才會信任你的末端憑證。</text>
  <text x="360" y="285" class="annotation" text-anchor="middle">若伺服器回應中缺少中繼，鏈即斷裂，連線失敗。</text>

  <!-- Bracket showing what's transmitted -->
  <line x1="40" y1="240" x2="460" y2="240" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="40" y1="240" x2="40" y2="232" stroke="#10B981" stroke-width="1.5"/>
  <line x1="460" y1="240" x2="460" y2="232" stroke="#10B981" stroke-width="1.5"/>
  <text x="250" y="328" class="annotation" text-anchor="middle" fill="#065F46" style="font-style: normal; font-weight: 600; font-size: 11px;">由伺服器送出（你的責任）</text>
  <text x="250" y="345" class="annotation" text-anchor="middle" fill="#065F46">末端憑證 + 中繼憑證</text>

  <!-- Bracket for client side -->
  <line x1="480" y1="240" x2="680" y2="240" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="240" x2="480" y2="232" stroke="#D97706" stroke-width="1.5"/>
  <line x1="680" y1="240" x2="680" y2="232" stroke="#D97706" stroke-width="1.5"/>
  <text x="580" y="328" class="annotation" text-anchor="middle" fill="#92400E" style="font-style: normal; font-weight: 600; font-size: 11px;">在客戶端信任庫</text>
  <text x="580" y="345" class="annotation" text-anchor="middle" fill="#92400E">根憑證隨瀏覽器/作業系統內建</text>
</svg>
