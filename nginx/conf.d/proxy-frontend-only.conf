    # Strapi Cloud: CMS admin/API/uploads are on Strapi's host, not this proxy.
    # Next.js uses STRAPI_URL / NEXT_PUBLIC_STRAPI_URL to talk to Strapi directly.

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(css|js|woff2?|ttf|eot|png|jpg|jpeg|webp|svg|ico|gif)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
